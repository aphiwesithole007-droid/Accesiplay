<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start 7-Day Free Trial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="voice-status" id="voice-status" aria-live="polite">
        <div class="mic-icon" id="mic-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </div>
        <span id="status-text">Click to enable Voice Control</span>
    </div>

    <main id="main-content" role="main" class="container">
        
        <div class="content-wrapper" id="form-container">
            <h1 class="main-title">Start 7-Day Free Trial</h1>
            <p class="subtitle">Enter card details to begin. You will not be charged today.</p>
            
            <div aria-live="polite" id="form-announcer" class="sr-only"></div>

            <form id="trial-form" novalidate>
                <div class="form-group">
                    <label for="card-number">Card Number</label>
                    <input type="text" id="card-number" name="card-number" required autocomplete="cc-number" inputmode="numeric" placeholder="1234 5678 9101 1121" aria-describedby="card-error">
                    <span class="error-message" id="card-error" role="alert"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry-date">Expiry (MM/YY)</label>
                        <input type="text" id="expiry-date" name="expiry-date" required autocomplete="cc-exp" placeholder="MM/YY" aria-describedby="expiry-error">
                        <span class="error-message" id="expiry-error" role="alert"></span>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" required autocomplete="cc-csc" inputmode="numeric" placeholder="123" aria-describedby="cvv-error">
                        <span class="error-message" id="cvv-error" role="alert"></span>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" id="submit-btn" class="massive-button">
                        <span class="btn-text">Start Free Trial</span>
                    </button>
                    <p class="voice-hint">Say <strong>"Submit"</strong> or click to start.</p>
                </div>
            </form>
        </div>

        <div id="success-message" class="success-message content-wrapper" hidden tabindex="-1">
            <div class="success-icon">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h1 class="main-title">Trial Started!</h1>
            <p class="subtitle">Your 7-day free trial has begun successfully. Welcome aboard.</p>
            <button class="massive-button secondary" onclick="window.location.reload()">Start Over</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
